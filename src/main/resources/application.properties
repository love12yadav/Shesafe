# ================================================================
# pgvector DataSource  (separate from the MySQL primary datasource)
# ================================================================
spring.ai.vectorstore.pgvector.datasource.url=jdbc:postgresql://localhost:5432/sos
spring.ai.vectorstore.pgvector.datasource.username=postgres
spring.ai.vectorstore.pgvector.datasource.password=pass
spring.ai.vectorstore.pgvector.datasource.driver-class-name=org.postgresql.Driver

# pgvector table / dimension settings
# Gemini text-embedding-004 produces 768-dim vectors
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.initialize-schema=true

# ================================================================
# Spring AI - Google Vertex AI Gemini
# API key from env var GEMINI_API_KEY (never hardcoded)
# ================================================================
spring.ai.vertex.ai.gemini.project-id=${GEMINI_PROJECT_ID:shesafe}
spring.ai.vertex.ai.gemini.location=${GEMINI_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.api-key=${GEMINI_API_KEY}
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.0-flash
spring.ai.vertex.ai.gemini.embedding.options.model=text-embedding-004
spring.ai.vertex.ai.gemini.transport=REST

# ================================================================
# Area Risk feature settings (configurable thresholds)
# ================================================================
area.risk.threshold.high-percentile=75
area.risk.threshold.safe-percentile=25
area.risk.cache.ttl-minutes=60
area.risk.gemini.timeout-seconds=15
area.risk.rag.chunks-per-area=2
area.risk.rag.chunks-global=2
